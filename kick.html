<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Yayın İzleyici</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

input{
    padding:12px;
    width:70%;
    max-width:400px;
    border:none;
    border-radius:6px;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:6px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.player-wrapper{
    position:relative;
    width:100%;
    padding-top:56.25%;
    margin-top:20px;
}

.player-wrapper iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
}
</style>
</head>

<body>

<div class="container">

<h2>Kick Yayın İzle</h2>

<input type="text" id="kickName" placeholder="Kick kullanıcı adı (örnek: chips)">
<button onclick="loadStream()">Yayını Aç</button>

<div class="player-wrapper" id="playerBox"></div>

</div>

<script>
function loadStream(){
    const name = document.getElementById("kickName").value.trim();

    if(!name){
        alert("Kick kullanıcı adı gir.");
        return;
    }

    const iframe = `<iframe src="https://player.kick.com/${name}" allowfullscreen></iframe>`;
    document.getElementById("playerBox").innerHTML = iframe;
}
</script>

</body>
</html>
