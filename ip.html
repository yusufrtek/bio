<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini IPTV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0e0e0e;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.container {
    width:100%;
    max-width:600px;
    padding:15px;
}

video {
    width:100%;
    border-radius:10px;
    background:black;
}

input, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

input {
    background:#1e1e1e;
    color:white;
}

button {
    background:#ff3c3c;
    color:white;
    cursor:pointer;
}

button:hover {
    background:#ff1f1f;
}
</style>
</head>

<body>

<div class="container">
    <h2>Canlı Yayın Oynatıcı</h2>

    <video id="video" controls autoplay></video>

    <input type="text" id="url" placeholder="m3u8 yayın linki gir...">

    <button onclick="play()">Yayını Başlat</button>
</div>

<script>
function play() {
    const url = document.getElementById("url").value;
    const video = document.getElementById("video");

    if (!url) {
        alert("Link girmen lazım.");
        return;
    }

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
    } else {
        alert("Tarayıcı desteklemiyor.");
    }
}
</script>

</body>
</html>
