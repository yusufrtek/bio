<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATBOK TV PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background:#0b0f1a;
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* SIDEBAR */
.sidebar {
    width:260px;
    background:#121826;
    padding:15px;
    overflow-y:auto;
    transition:0.3s;
}

.sidebar h2 {
    font-weight:900;
    margin-bottom:10px;
}

.channel {
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.channel:hover {
    background:#1e293b;
}

.channel img {
    width:30px;
    height:30px;
    border-radius:6px;
}

.channel.active {
    background:#2563eb;
}

/* MAIN */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar {
    padding:10px;
    background:#121826;
    text-align:center;
    font-weight:bold;
}

.player {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

video {
    width:100%;
    max-width:900px;
    border-radius:12px;
    background:black;
}

/* MOBILE */
@media(max-width:768px) {
    body {
        flex-direction:column;
    }

    .sidebar {
        width:100%;
        height:150px;
        display:flex;
        overflow-x:auto;
        overflow-y:hidden;
    }

    .channel {
        min-width:120px;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="sidebar" id="channelList"></div>

<div class="main">
    <div class="topbar" id="title">Kanal Seç</div>
    <div class="player">
        <video id="video" controls autoplay></video>
    </div>
</div>

<script>
const channels = [
    { name: "TRT 1", logo: "https://upload.wikimedia.org/wikipedia/commons/6/6c/Trt1.png", url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
    { name: "Bein Sports 1", logo: "https://trgooltv61.top/img/beinsports1.png", url: "https://wild-credit-2cd4.gamzeerdemmilf.workers.dev/https://corestream.ronaldovurdu.help//hls/bein-sports-1.m3u8" },
    { name: "Bein Sports 2", logo: "https://trgooltv61.top/img/beinsports2.png", url: "https://wild-credit-2cd4.gamzeerdemmilf.workers.dev/https://corestream.ronaldovurdu.help//hls/bein-sports-2.m3u8" },
    { name: "TRT Spor", logo: "https://upload.wikimedia.org/wikipedia/tr/5/5d/TRT_Spor.png", url: "https://tv-trtspor1.medya.trt.com.tr/master.m3u8" },
    { name: "A Spor", logo: "https://upload.wikimedia.org/wikipedia/tr/4/4f/A_Spor.png", url: "https://trkvz.daioncdn.net/aspor/aspor_1080p.m3u8" }
];

const list = document.getElementById("channelList");
const video = document.getElementById("video");
const title = document.getElementById("title");

function play(url, name, el) {
    document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    title.innerText = name;

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.src = url;
        video.play();
    }
}

channels.forEach(c => {
    const div = document.createElement("div");
    div.className = "channel";
    div.innerHTML = `<img src="${c.logo}"><span>${c.name}</span>`;
    div.onclick = () => play(c.url, c.name, div);
    list.appendChild(div);
});
</script>

</body>
</html>
